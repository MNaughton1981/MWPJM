<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Asset Registry Assistant</title><style>body{font:16px system-ui;margin:auto;max-width:720px;padding:20px;color:#18313f}label{display:block;margin:14px 0 5px;font-weight:700}input,textarea,button{box-sizing:border-box;width:100%;padding:12px;font:inherit}button{margin-top:18px;background:#174a72;color:white;border:0;border-radius:8px}</style><h1>Asset Registry Assistant</h1><p>Capture the data plate, then enter only values clearly visible on the tag.</p><form action="/capture" method="post" enctype="multipart/form-data"><label>Equipment photo</label><input type="file" name="photo" accept="image/*" capture="environment" required><label>Equipment type</label><input name="equipment_type"><label>Manufacturer</label><input name="manufacturer"><label>Model</label><input name="model"><label>Serial number</label><input name="serial_number"><label>Foodservice unit tag</label><input name="unit_tag"><label>Location</label><input name="location_name"><label>Notes</label><textarea name="notes"></textarea><button>Validate and create draft</button></form>
